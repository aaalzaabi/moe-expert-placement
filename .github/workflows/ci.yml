name: CI

on:
  push:
  pull_request:

# Jobs get read-only access by default; only the publish job may write packages.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies (no torch, no model download)
        run: pip install -r requirements-ci.txt
      - name: Run test suite
        run: python -m unittest discover -s tests -t . -v
      - name: Check original results are reproduced
        run: python -m unittest tests.test_reproduction -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build
      - name: Test suite inside the image
        run: docker compose --profile test run --rm tests
      - name: End-to-end workflow on SQLite and PostgreSQL
        run: |
          docker compose up -d api
          docker compose --profile postgres up -d db api-pg
          for p in 8000 8001; do
            for i in $(seq 1 30); do curl -sf localhost:$p/health && break; sleep 2; done
            python3 scripts/smoke_e2e.py --url http://localhost:$p
          done
      - name: Logs on failure
        if: failure()
        run: docker compose --profile postgres logs

  # CD: once both CI jobs pass, publish the image to GitHub Container Registry.
  # Runs only for pushes to main and for version tags (v1.0.0 ...), never for pull requests or other branches.
  #   docker pull ghcr.io/aaalzaabi/moe-expert-placement:latest
  publish:
    needs: [tests, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # main -> latest + sha-<short>;  tag v1.2.3 -> 1.2.3, 1.2 + sha-<short>
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
