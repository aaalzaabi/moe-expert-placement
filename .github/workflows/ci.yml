name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies (no torch, no model download)
        run: pip install -r requirements-ci.txt
      - name: Run test suite
        run: python -m unittest discover -s tests -t . -v
      - name: Check original results are reproduced
        run: python -m unittest tests.test_reproduction -v
